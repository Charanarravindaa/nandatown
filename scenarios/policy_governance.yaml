# SPDX-License-Identifier: Apache-2.0
name: policy_governance
description: >
  Identity-bound policy enforcement. Each agent carries an Ed25519-signed manifest
  bounding its tools, data exposure, spend, and authorization-required actions.
  Honest agents stay in policy; byzantine agents violate every dimension; a
  forged-manifest agent is governed by a deny-all policy. The `enforcement` toggle
  (enforced|permissive) turns the runtime PolicyEnforcer on/off — the
  policy_governance validators flip every verdict on that one switch.

tier: 1
seed: 42

agents:
  count: 5
  brain: state-machine

layers:
  transport: in_memory
  comms: nest_native
  identity: ed25519_rotating
  registry: in_memory
  auth: policy_auth
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1
  policy: manifest_policy

task:
  type: policy_governance
  config:
    enforcement: enforced   # set to "permissive" to disable the PolicyEnforcer

duration: "ticks: 10000"

output:
  trace: ./traces/policy_governance.jsonl
